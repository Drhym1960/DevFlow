<!doctype html>

    <title>MysticTxt App Store shots 1080 x 2340</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #3b2a1a;
        --gold: #b69130;
        --cream: #fdf8ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--cream);
        color: var(--ink);
      }
      main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
      h1 { font-size: 2rem; margin: 0 0 8px; }
      p { font-family: system-ui, sans-serif; color: #6b5420; }
      .grid {
        display: grid;
        gap: 24px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        margin-top: 28px;
      }
      figure {
        margin: 0;
        background: #fff;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 16px 40px rgba(59, 42, 26, 0.08);
      }
      img { display: block; width: 100%; height: auto; background: #f4ead8; }
      figcaption { padding: 16px; font-family: system-ui, sans-serif; }
      a {
        color: var(--gold);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }
    </style>
